services:
  crm:
    image: ghcr.io/thepillock/pureamiga-crm:latest   # or :test; replace with `build: .` to build locally
    container_name: pureamiga-crm
    restart: unless-stopped
    ports:
      - "3300:3300"
    volumes:
      - ./data:/data          # on Unraid: /mnt/user/appdata/pureamiga-crm:/data
    environment:
      - TZ=Europe/London
